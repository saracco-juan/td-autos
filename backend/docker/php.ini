; Production PHP settings for the API image.
expose_php = Off
memory_limit = 256M
; Payment receipts and vehicle photos are limited to 5 MB each by validation.
upload_max_filesize = 10M
post_max_size = 64M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
