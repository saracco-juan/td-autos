# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml.
# Organization and project keys must match the project created in SonarQube Cloud.
sonar.organization=saracco-juan
sonar.projectKey=saracco-juan_td-autos
sonar.projectName=TD Autos

sonar.sources=backend/app,backend/routes,backend/config,backend/database,backend/bootstrap/app.php,frontend/web/src
sonar.tests=backend/tests,frontend/web/src
sonar.test.inclusions=backend/tests/**,frontend/web/src/**/*.test.ts,frontend/web/src/**/*.test.tsx,frontend/web/src/test/**
sonar.exclusions=frontend/web/src/**/*.test.ts,frontend/web/src/**/*.test.tsx,frontend/web/src/test/**

# Coverage is only measured where the test suites can reach.
sonar.coverage.exclusions=backend/config/**,backend/database/**,backend/routes/**,backend/bootstrap/**,frontend/web/src/main.tsx

sonar.php.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/web/coverage/lcov.info

sonar.sourceEncoding=UTF-8
