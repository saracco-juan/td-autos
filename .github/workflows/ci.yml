name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      # Tests run against in-memory SQLite, forced by phpunit.xml.
      - name: Run tests
        run: php artisan test --coverage-clover=coverage.xml

      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  mobile:
    name: Mobile app (React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npx expo export --platform android

      - uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: frontend/mobile/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  # Fails fast, before Sonar, when the PR's new code is over the duplication limit of the quality gate.
  duplication:
    name: Duplication on new code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check duplication against the base branch
        run: node scripts/check-duplication.mjs --base origin/${{ github.base_ref }}

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile]
    # Secrets are not available to pull requests opened from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history gives Sonar accurate blame and new-code detection.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend

      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/web/coverage

      - uses: actions/download-artifact@v8
        with:
          name: mobile-coverage
          path: frontend/mobile/coverage

      # Vitest writes paths relative to frontend/web; Sonar resolves them from the repository root.
      # The web suite also covers frontend/shared, written as ../shared.
      - name: Rebase frontend coverage paths
        run: |
          sed -i 's|^SF:src/|SF:frontend/web/src/|' frontend/web/coverage/lcov.info
          sed -i 's|^SF:\.\./shared/|SF:frontend/shared/|' frontend/web/coverage/lcov.info

      # Jest writes paths relative to frontend/mobile as well.
      - name: Rebase mobile coverage paths
        run: sed -i 's|^SF:src/|SF:frontend/mobile/src/|' frontend/mobile/coverage/lcov.info

      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
