name: Cron

# Render free has no cron: this workflow triggers the hourly subscription lifecycle
# (`suscripciones:procesar`) and, on the 1st of each month at 04:00 Argentina time, the calculator
# refresh (`calculadora:refresh`: fuel prices and CPI) and, on January 1 at 05:00 Argentina time, the yearly review of the
# hand-reviewed calculator values (`calculadora:review`, which opens a GitHub issue) through the API's protected endpoints,
# once per environment.
# Configure in GitHub (Settings -> Secrets and variables -> Actions):
#   variables PROD_API_URL / DEV_API_URL  Render service URLs, e.g. https://td-autos-api.onrender.com
#   secrets   CRON_SECRET_PROD / CRON_SECRET_DEV  the CRON_SECRET of each Render service
# An environment with a missing variable or secret is skipped. Scheduled runs only happen on the
# default branch, and GitHub disables them after 60 days without repository activity.

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 7 1 * *'
    - cron: '0 8 1 1 *'
  workflow_dispatch:

concurrency:
  group: cron-${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  subscriptions:
    name: Subscriptions (${{ matrix.environment }})
    if: github.event.schedule != '0 7 1 * *' && github.event.schedule != '0 8 1 1 *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            url_var: PROD_API_URL
            secret: CRON_SECRET_PROD
          - environment: development
            url_var: DEV_API_URL
            secret: CRON_SECRET_DEV
    steps:
      - name: Trigger the subscription lifecycle
        env:
          API_URL: ${{ vars[matrix.url_var] }}
          CRON_SECRET: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::${{ matrix.url_var }} or ${{ matrix.secret }} is not configured; skipping ${{ matrix.environment }}."
            exit 0
          fi
          # A sleeping Render free service takes about a minute to start: long timeout plus retries.
          curl --silent --show-error --fail-with-body \
            --max-time 120 --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "${API_URL%/}/internal/cron/subscriptions"
          echo

  calculator:
    name: Calculator refresh (${{ matrix.environment }})
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            url_var: PROD_API_URL
            secret: CRON_SECRET_PROD
          - environment: development
            url_var: DEV_API_URL
            secret: CRON_SECRET_DEV
    steps:
      - name: Refresh the calculator fuel prices and CPI
        env:
          API_URL: ${{ vars[matrix.url_var] }}
          CRON_SECRET: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::${{ matrix.url_var }} or ${{ matrix.secret }} is not configured; skipping ${{ matrix.environment }}."
            exit 0
          fi
          # Downloads a ~9 MB CSV on a service that may be asleep: long timeout, no retry (the endpoint is idempotent but slow).
          curl --silent --show-error --fail-with-body             --max-time 300             -X POST             -H "Authorization: Bearer $CRON_SECRET"             -H "Accept: application/json"             "${API_URL%/}/internal/cron/calculadora"
          echo

  calculator-review:
    name: Calculator yearly review (${{ matrix.environment }})
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 1 1 *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            url_var: PROD_API_URL
            secret: CRON_SECRET_PROD
    steps:
      - name: Run the review
        env:
          API_URL: ${{ vars[matrix.url_var] }}
          CRON_SECRET: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::${{ matrix.url_var }} or ${{ matrix.secret }} is not configured; skipping ${{ matrix.environment }}."
            exit 0
          fi
          # Alert only: the endpoint answers 200 whatever it finds. It checks every source URL (5 s each, in parallel).
          curl --silent --show-error --fail-with-body \
            --max-time 180 --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            -o review.json \
            "${API_URL%/}/internal/cron/calculadora-revision"
          jq -r .markdown review.json > review.md
          jq -r .title review.json > review-title.txt
          echo "STALE_COUNT=$(jq '.stale | length' review.json)" >> "$GITHUB_ENV"
          echo "REVIEW_READY=true" >> "$GITHUB_ENV"
          cat review.md

      - name: Open the review issue
        if: env.REVIEW_READY == 'true' && env.STALE_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh issue create --title "$(cat review-title.txt)" --body-file review.md
